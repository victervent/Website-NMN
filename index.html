<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Victervent Arcade NMN</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;800&display=swap">
<link rel="stylesheet" href="arcade-extra.css">
<style>
:root{--bg:#f6f7fb;--ink:#13111c;--mut:#686577;--card:#fff;--line:#e4e5ef;--acc:#5b3df5;--hdr:rgba(246,247,251,.86);--sh:0 26px 50px -26px rgba(30,20,80,.45);color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#100f17;--ink:#f3f1fa;--mut:#a09bb2;--card:#1b1925;--line:#2e2b3b;--acc:#7c5cff;--hdr:rgba(16,15,23,.86);--sh:0 26px 50px -26px #000;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#100f17;--ink:#f3f1fa;--mut:#a09bb2;--card:#1b1925;--line:#2e2b3b;--acc:#7c5cff;--hdr:rgba(16,15,23,.86);--sh:0 26px 50px -26px #000;color-scheme:dark}
*{box-sizing:border-box;margin:0}
html{scroll-behavior:smooth;scroll-padding-top:calc(env(safe-area-inset-top,0px) + 72px);background:var(--bg)}
body{font:400 16px/1.6 "Be Vietnam Pro",system-ui,sans-serif;color:var(--ink);background:var(--bg);overflow-x:hidden}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:60;background:var(--hdr);backdrop-filter:blur(14px)}
h1,h2,h3{font-weight:800;letter-spacing:-.03em;line-height:1.1}
a{color:inherit;text-decoration:none}
header{position:sticky;top:env(safe-area-inset-top,0px);z-index:50;display:flex;align-items:center;justify-content:space-between;gap:12px;padding:12px max(20px,5vw);background:var(--hdr);backdrop-filter:blur(14px);border-bottom:1px solid var(--line)}
.logo{font-weight:800;font-size:21px;letter-spacing:-.04em;display:flex;align-items:center;gap:6px}
.logo i{width:9px;height:9px;border-radius:50%;background:var(--acc)}
nav{display:flex;gap:20px;align-items:center;font-weight:500;font-size:15px}
nav a:hover{color:var(--acc)}
.tb{width:40px;height:40px;border-radius:50%;border:1px solid var(--line);background:var(--card);color:var(--ink);cursor:pointer;font-size:16px;transition:transform .25s}
.tb:hover{transform:rotate(25deg) scale(1.08)}
.btn{position:relative;overflow:hidden;display:inline-flex;align-items:center;justify-content:center;padding:14px 26px;border-radius:99px;border:1.5px solid var(--ink);background:var(--ink);color:var(--bg);font:600 15px "Be Vietnam Pro",sans-serif;cursor:pointer;transition:transform .25s,box-shadow .25s}
.btn::after{content:"";position:absolute;inset:0;background:linear-gradient(110deg,transparent 30%,#fff6 50%,transparent 70%);translate:-120% 0;transition:translate .6s}
.btn:hover{transform:translateY(-2px);box-shadow:0 14px 26px -12px var(--acc)}
.btn:hover::after{translate:120% 0}
.btn.g{background:transparent;color:var(--ink)}
.btn.p{background:var(--acc);border-color:var(--acc);color:#fff}
.hero{display:grid;grid-template-columns:1.1fr 1fr;gap:40px;align-items:center;max-width:1280px;margin:auto;padding:48px max(20px,5vw) 24px}
h1{font-size:clamp(46px,8vw,108px);line-height:1.06;letter-spacing:-.05em}
.ol{color:transparent;-webkit-text-stroke:2px var(--ink)}
.hero p{color:var(--mut);max-width:44ch;margin:20px 0 28px;font-size:18px}
.cta{display:flex;gap:12px;flex-wrap:wrap}
.col{position:relative;height:470px}
.hc{position:absolute;width:min(250px,50%);aspect-ratio:4/5;border-radius:22px;overflow:hidden;border:6px solid #fff;box-shadow:var(--sh);animation:drop .9s cubic-bezier(.2,1.3,.3,1) both;translate:calc(var(--px,0)*var(--k)*1px) calc(var(--py,0)*var(--k)*1px)}
.h1{left:0;top:56px;rotate:-7deg;--k:14}
.h2{left:27%;top:0;rotate:4deg;--k:28;z-index:2;animation-delay:.12s}
.h3{right:0;top:116px;rotate:-2deg;--k:8;animation-delay:.24s}
.mq{overflow:hidden;background:var(--ink);color:var(--bg);padding:14px 0;margin:34px 0;font-weight:800;font-size:clamp(20px,3vw,32px);letter-spacing:-.02em;white-space:nowrap;rotate:-1.2deg}
.mq div{display:inline-block;animation:mq 30s linear infinite}
.shop{max-width:1280px;margin:auto;padding:30px max(20px,5vw) 80px}
.sh{display:flex;justify-content:space-between;align-items:end;gap:16px;flex-wrap:wrap;margin-bottom:28px}
.sh h2{font-size:clamp(32px,5vw,56px)}
.chips{display:flex;gap:8px;flex-wrap:wrap}
.chip{padding:9px 18px;border-radius:99px;border:1px solid var(--line);background:var(--card);color:var(--ink);font:600 14px "Be Vietnam Pro",sans-serif;cursor:pointer;transition:background .25s,color .25s}
.chip.on,.chip:hover{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:34px 26px}
.card{cursor:pointer;outline:0;transition:opacity .7s ease calc(var(--d)*80ms),translate .7s cubic-bezier(.2,.8,.2,1) calc(var(--d)*80ms)}
.card.hide{display:none}
.reveal{opacity:0;translate:0 34px}
.reveal.in{opacity:1;translate:0 0}
.ph{position:relative;aspect-ratio:4/5;border-radius:20px;overflow:hidden;transform:perspective(900px) rotateX(var(--rx,0deg)) rotateY(var(--ry,0deg));transition:transform .25s ease,box-shadow .35s}
.card:hover .ph,.card:focus-visible .ph{box-shadow:0 30px 50px -26px var(--ca,#0006)}
.card:focus-visible .ph{outline:3px solid var(--acc);outline-offset:3px}
.vis{position:absolute;inset:0;background:var(--c1);overflow:hidden}
.vis::before{content:"";position:absolute;width:78%;aspect-ratio:1;border-radius:50%;background:var(--c2);top:-18%;right:-24%}
.vis::after{content:"";position:absolute;width:46%;aspect-ratio:1;border-radius:50%;background:#fff6;left:-12%;bottom:-8%}
.vis svg,.vis img{position:absolute;inset:0;width:100%;height:100%;z-index:1;transition:transform .7s cubic-bezier(.2,.8,.2,1)}
.vis img{object-fit:cover;z-index:2}
.card:hover .vis svg,.card:hover .vis img{transform:scale(1.09) rotate(1.2deg)}
.ph::after{content:"";position:absolute;inset:0;z-index:4;pointer-events:none;background:linear-gradient(105deg,transparent 35%,#fff7 50%,transparent 65%);translate:-110% 0;transition:translate .8s}
.card:hover .ph::after{translate:110% 0}
.bd{position:absolute;left:12px;top:12px;z-index:5;background:#fff;color:#13111c;font-weight:800;font-size:12px;padding:4px 12px;border-radius:99px}
.fav{position:absolute;right:12px;top:12px;z-index:5;width:38px;height:38px;border-radius:50%;border:0;background:#fffd;color:#a9a4b8;font-size:17px;cursor:pointer;transition:transform .25s,color .25s}
.fav:hover{transform:scale(1.15)}
.fav.on{color:#ff3b5c;animation:pop .45s}
.qv{position:absolute;left:12px;right:12px;bottom:12px;z-index:5;text-align:center;background:#fffe;color:#13111c;padding:11px;border-radius:14px;font-weight:600;font-size:14px;backdrop-filter:blur(8px);translate:0 70px;transition:translate .4s cubic-bezier(.2,.8,.2,1)}
.card:hover .qv,.card:focus-visible .qv{translate:0 0}
@media(hover:none){.qv{translate:0 0}}
.inf{padding:14px 4px 0}
.inf small{color:var(--acc);font-weight:600;font-size:13px}
.inf h3{font-size:22px;margin:2px 0 4px}
.inf p{color:var(--mut);font-size:14px;line-height:1.5;min-height:42px}
.row{display:flex;justify-content:space-between;align-items:center;margin-top:12px;font-size:14px;font-weight:600}
.pr{border:1px solid var(--line);background:var(--card);padding:3px 13px;border-radius:99px}
.more{background:linear-gradient(var(--acc),var(--acc)) 0 100%/0 2px no-repeat;transition:background-size .3s}
.card:hover .more{background-size:100% 2px}
.ov{position:fixed;inset:0;z-index:100;display:grid;place-items:center;padding:20px;background:rgba(18,12,30,.6);backdrop-filter:blur(8px);opacity:0;visibility:hidden;transition:opacity .35s,visibility .35s}
.ov.on{opacity:1;visibility:visible}
.md{position:relative;display:grid;grid-template-columns:1.1fr 1fr;width:min(1000px,100%);max-height:92dvh;overflow:auto;background:var(--card);border-radius:28px;box-shadow:0 40px 90px -20px #000a;scale:.92;translate:0 30px;transition:scale .45s cubic-bezier(.2,1.2,.3,1),translate .45s cubic-bezier(.2,1.2,.3,1)}
.ov.on .md{scale:1;translate:0 0}
.x{position:absolute;right:14px;top:14px;z-index:6}
.mv{padding:26px;background:color-mix(in srgb,var(--c1,#ddd) 40%,var(--bg));display:flex;align-items:center}
.win{width:100%;border-radius:16px;overflow:hidden;border:1px solid var(--line);box-shadow:var(--sh);background:var(--card)}
.bar{display:flex;align-items:center;gap:6px;padding:10px 12px;border-bottom:1px solid var(--line)}
.bar i{width:10px;height:10px;border-radius:50%;background:#ff5f57}
.bar i:nth-child(2){background:#febc2e}
.bar i:nth-child(3){background:#28c840}
.url{margin-left:8px;flex:1;font-size:12px;color:var(--mut);background:var(--bg);padding:4px 12px;border-radius:99px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.shot{position:relative;aspect-ratio:4/3}
.mi{padding:36px 34px 26px;display:flex;flex-direction:column;gap:10px}
.mi small{color:var(--acc);font-weight:600;font-size:14px}
.mi h2{font-size:clamp(32px,4vw,46px)}
.mi p{color:var(--mut)}
.mi h4{margin-top:6px;font-size:15px}
.ft{list-style:none;padding:0;display:grid;gap:9px}
.ft li{display:flex;gap:10px;font-size:15px;opacity:0;translate:0 10px;animation:up .5s forwards}
.ft li::before{content:"✓";flex:none;width:22px;height:22px;border-radius:50%;background:var(--a,var(--acc));color:#fff;display:grid;place-items:center;font-size:12px;margin-top:2px}
.tg{display:flex;gap:6px;flex-wrap:wrap}
.tg span{font-size:13px;padding:3px 12px;border-radius:99px;background:var(--bg);border:1px solid var(--line)}
.act{display:flex;gap:10px;flex-wrap:wrap;margin-top:auto;padding-top:14px}
.nv{display:flex;justify-content:space-between;align-items:center;font-size:13px;color:var(--mut);padding-top:14px;border-top:1px solid var(--line)}
.nv .chip{padding:6px 14px}
footer{text-align:center;padding:36px 20px 50px;color:var(--mut);font-size:14px;border-top:1px solid var(--line)}
.flip{transform-box:fill-box;transform-origin:center}
.card:hover .flip,.shot .flip{animation:flip 3s ease-in-out infinite}
@keyframes drop{from{opacity:0;transform:translateY(-70px) scale(.9)}}
@keyframes mq{to{transform:translateX(-50%)}}
@keyframes pop{40%{scale:1.5}}
@keyframes up{to{opacity:1;translate:0 0}}
@keyframes flip{50%{transform:scaleX(.12)}}
::selection{background:var(--acc);color:#fff}
.pg{position:absolute;left:0;bottom:-1px;height:3px;width:var(--p,0%);background:var(--acc)}
.tools{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
#q{width:190px;padding:10px 18px;border-radius:99px;border:1px solid var(--line);background:var(--card);color:var(--ink);font:500 14px 'Be Vietnam Pro',sans-serif;transition:width .35s cubic-bezier(.2,.8,.2,1),border-color .25s,box-shadow .25s}
#q:focus{width:260px;outline:0;border-color:var(--acc);box-shadow:0 0 0 4px color-mix(in srgb,var(--acc) 22%,transparent)}
#fv{display:inline-flex;align-items:center}
#fc{display:inline-grid;place-items:center;min-width:20px;height:20px;margin-left:8px;border-radius:99px;background:var(--acc);color:#fff;font-size:12px}
.nq,#grid.fo .card:not(.lk){display:none}
#none{text-align:center;color:var(--mut);padding:50px 0}
.ph::before{content:"";position:absolute;inset:0;z-index:4;pointer-events:none;background:radial-gradient(240px circle at var(--gx,50%) var(--gy,50%),#fff8,transparent 65%);opacity:0;transition:opacity .3s}
.card:hover .ph::before{opacity:1}
#new{display:grid;grid-template-columns:minmax(0,300px) 1fr;gap:34px;align-items:center;margin-bottom:46px;padding:16px;border-radius:30px;background:color-mix(in srgb,var(--c1,#ddd) 34%,var(--bg));cursor:pointer;transition:transform .35s cubic-bezier(.2,.8,.2,1)}
#new:hover{transform:scale(1.012)}
.nvis{position:relative;aspect-ratio:4/3;border-radius:20px;overflow:hidden}
#new small{color:var(--acc);font-weight:600}
#new h3{font-size:clamp(28px,4vw,44px);margin:4px 0 8px}
#new p{color:var(--mut);max-width:52ch;margin-bottom:18px}
.shot svg>*{animation:pi .7s cubic-bezier(.2,1.3,.3,1) both}
.md .btn.p{background:var(--a,var(--acc));border-color:var(--a,var(--acc))}
.toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom,0px));translate:-50% 30px;opacity:0;z-index:300;background:var(--ink);color:var(--bg);padding:11px 20px;border-radius:99px;font-weight:600;font-size:14px;pointer-events:none;transition:opacity .3s,translate .4s cubic-bezier(.2,1.2,.3,1)}
.toast.on{opacity:1;translate:-50% 0}
.bt{position:fixed;z-index:300;pointer-events:none;color:#ff3b5c;font-size:16px;animation:bt .8s ease-out forwards}
@keyframes pi{from{opacity:0;translate:0 26px}}
@keyframes bt{to{transform:translate(var(--x),var(--y)) scale(.4);opacity:0}}
@media(max-width:820px){
.hero{grid-template-columns:1fr;padding-top:30px}.col{height:370px}nav a{display:none}#new{grid-template-columns:1fr;gap:18px}#q{width:150px}
.ov{align-items:end;padding:0}.md{grid-template-columns:1fr;border-radius:26px 26px 0 0;max-height:94dvh;padding-bottom:env(safe-area-inset-bottom,0px)}.mi{padding:24px}}
@media(prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}.reveal{opacity:1;translate:0 0}.ft li{opacity:1;translate:0 0}}

body{background:transparent}
body::after{content:"";position:fixed;inset:-10%;z-index:-1;pointer-events:none;
  background:
    radial-gradient(40% 35% at 15% 10%,color-mix(in srgb,var(--acc) 20%,transparent),transparent 70%),
    radial-gradient(35% 40% at 88% 55%,color-mix(in srgb,#ff5c93 14%,transparent),transparent 70%);
  animation:drift 24s ease-in-out infinite alternate}
@keyframes drift{to{transform:translate3d(-3%,4%,0) scale(1.06)}}

/* Điểm nhấn chính: thẻ "Mới lên kệ" có viền chuyển màu chạy quanh */
#new{position:relative}
#new::after{content:"";position:absolute;inset:0;border-radius:inherit;padding:2px;pointer-events:none;
  background:conic-gradient(from var(--ang),var(--acc),#ff5c93,#ffc933,var(--acc));
  -webkit-mask:linear-gradient(#fff 0 0) content-box,linear-gradient(#fff 0 0);
  -webkit-mask-composite:xor;mask-composite:exclude;
  animation:spin 7s linear infinite}
@keyframes spin{to{--ang:360deg}}
#new .nvis{box-shadow:var(--sh)}
#new small::before{content:"";display:inline-block;width:8px;height:8px;margin-right:8px;border-radius:50%;
  background:#ff3b5c;animation:ping 2s ease-out infinite}
@keyframes ping{0%{box-shadow:0 0 0 0 #ff3b5c99}100%{box-shadow:0 0 0 10px #ff3b5c00}}

/* Thẻ game: bóng và nhãn mang màu riêng của từng game */
.ph{box-shadow:0 18px 30px -22px var(--ca,#0004);
  transition:transform .25s ease,box-shadow .35s,translate .35s cubic-bezier(.2,.8,.2,1)}
.card:hover .ph,.card:focus-visible .ph{translate:0 -6px}
.inf small{color:color-mix(in srgb,var(--ca,var(--acc)) 75%,var(--ink))}
.pr{background:color-mix(in srgb,var(--ca,var(--acc)) 12%,var(--card));
  border-color:color-mix(in srgb,var(--ca,var(--acc)) 35%,var(--line));
  color:color-mix(in srgb,var(--ca,var(--acc)) 70%,var(--ink))}
.bd{box-shadow:0 6px 14px -6px #0005}

/* Bộ lọc và điều hướng */
.chip.on{background:var(--acc);border-color:var(--acc);color:#fff;box-shadow:0 8px 18px -10px var(--acc)}
nav a{padding-bottom:2px;background:linear-gradient(var(--acc),var(--acc)) 0 100%/0 2px no-repeat;
  transition:background-size .3s,color .2s}
nav a:hover{background-size:100% 2px}
.mq{-webkit-mask-image:linear-gradient(90deg,transparent,#000 8%,#000 92%,transparent);
  mask-image:linear-gradient(90deg,transparent,#000 8%,#000 92%,transparent)}
.mq:hover div{animation-play-state:paused}

/* Cửa sổ xem trước */
.mv{background-image:radial-gradient(color-mix(in srgb,var(--ink) 14%,transparent) 1.2px,transparent 1.6px);
  background-size:18px 18px}
.mi small{color:color-mix(in srgb,var(--a,var(--acc)) 70%,var(--ink))}
.tg span{border-color:color-mix(in srgb,var(--a,var(--acc)) 40%,var(--line));
  background:color-mix(in srgb,var(--a,var(--acc)) 8%,var(--card));
  color:color-mix(in srgb,var(--a,var(--acc)) 65%,var(--ink))}

/* Bàn phím và thanh cuộn */
.btn:focus-visible,.chip:focus-visible,.tb:focus-visible,.fav:focus-visible{outline:3px solid var(--acc);outline-offset:3px}
html{scrollbar-width:thin;scrollbar-color:color-mix(in srgb,var(--acc) 55%,var(--bg)) transparent}
/* Cần @property thì viền xoay của thẻ "Mới lên kệ" mới chạy */
@property --ang{syntax:'<angle>';inherits:false;initial-value:0deg}
/* Huy hiệu có màu theo loại */
.bd[data-b="Hot"],.bd[data-b="Mới"],.bd[data-b="Tiện ích"]{color:#fff}
.bd[data-b="Hot"]{background:linear-gradient(135deg,#ff8a3d,#ff3b5c)}
.bd[data-b="Mới"]{background:linear-gradient(135deg,#0f9d76,#3cc9a0)}
.bd[data-b="Tiện ích"]{background:linear-gradient(135deg,#1a62b8,#4f8fe0)}
/* Gạch nhấn dưới tiêu đề, tên game đổi sang màu riêng khi rê chuột */
.sh h2::after{content:"";display:block;width:64px;height:6px;margin-top:12px;border-radius:9px;background:linear-gradient(90deg,var(--acc),#ff5c93,#ffc933)}
.inf h3{transition:color .25s}
.card:hover .inf h3{color:color-mix(in srgb,var(--ca,var(--acc)) 80%,var(--ink))}
footer{border-image:linear-gradient(90deg,transparent,var(--acc),transparent) 1}
</style>
</head>
<body>
<header>
<a class="logo" href="#">Victervent<i></i></a>
<nav><a href="#shop">Bộ sưu tập</a><button class="tb" id="th" aria-label="Đổi giao diện sáng hoặc tối">◐</button></nav>
<i class="pg"></i>
</header>
<section class="hero" id="hero">
<div>
<h1>Chơi gì<br><span class="ol">hôm nay?</span></h1>
<p>Tám món chơi và công cụ do mình tự làm. Bấm vào một món để xem trước, rồi vào chơi luôn trên trình duyệt.</p>
<div class="cta"><a class="btn" href="#shop">Xem bộ sưu tập</a><button class="btn g" id="rnd">Chọn giúp tôi</button></div>
</div>
<div class="col" id="col"></div>
</section>
<div class="mq"><div id="mq"></div></div>
<main class="shop" id="shop">
<div id="new"></div>
<div class="sh"><h2>Bộ sưu tập</h2><div class="tools"><input id="q" type="search" placeholder="Tìm game (nhấn /)" aria-label="Tìm kiếm"><button class="chip" id="fv">♥ Yêu thích<b id="fc">0</b></button><div class="chips" id="chips"></div></div></div>
<div class="grid" id="grid"></div>
<p id="none" hidden>Chưa có món nào ở đây. Thử đổi bộ lọc hoặc từ khóa nhé.</p>
</main>
<div class="ov" id="ov" aria-hidden="true">
<div class="md" role="dialog" aria-modal="true" aria-labelledby="mt">
<button class="tb x" id="cl" aria-label="Đóng">✕</button>
<div class="mv" id="mv"></div>
<div class="mi" id="mi"></div>
</div>
</div>
<div class="toast" id="toast" role="status"></div>
<footer>© 2026 Victervent. Làm bằng ♥ cho cộng đồng game thủ Việt.</footer>
<script>
const $=s=>document.querySelector(s),$$=s=>[...document.querySelectorAll(s)],R=document.documentElement;
const CT={all:'Tất cả',fun:'Giải trí',fin:'Tài chính',edu:'Học tập'};
/* Sửa nội dung tại đây. Muốn dùng ảnh chụp thật: điền đường dẫn vào img (ví dụ 'img/balatro.jpg'). */
const G=[
{n:'Balatro',k:'Game thẻ bài',c:'fun',b:'Hot',c1:'#ffd9de',c2:'#ffc0c9',a:'#d62f4b',u:'https://victervent.github.io/Balatro/',img:'',
